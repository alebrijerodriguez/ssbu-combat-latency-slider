[package]
name = "ssbu-combat-latency-slider"
version = "1.0.0"
authors = ["alebro"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
skyline = "0.2.0"
skyline-web = "0.1.0"
ninput = { git = "https://github.com/blu-dev/ninput", branch = "master" }
once_cell = "=1.14.0"
itoa = "=0.4.8"
ryu = "=1.0.5"
crunchy = "=0.2.2"
quote = "=1.0.26"
syn = "=1.0.109"
unicode-ident = "=1.0.12"
getopts = "=0.2.21"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
