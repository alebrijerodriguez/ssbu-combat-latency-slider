name: Build Skyline Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: jugeeya/cargo-skyline:2.1.0

    steps:
      - uses: actions/checkout@v4

      - name: Build release NRO
        run: |
          PATH=$PATH:/root/.cargo/bin
          
          # Actualizar el índice de crates.io y retrocederlo a un commit de 2021 (Rust 2018 era estándar)
          cargo fetch || true
          cd /root/.cargo/registry/index/github.com-1ecc629db9ec823 || cd /root/.cargo/registry/index/*
          git checkout 84d2a13f7 || true
          cd -
          
          # Compilar el plugin
          cargo-skyline skyline build --release
        env:
          HOME: /root

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: latency-slider-4f-nro
          path: target/aarch64-skyline-switch/release/*.nro
