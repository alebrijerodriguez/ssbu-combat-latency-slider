name: Build Skyline Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/skyline-dev/cargo-skyline:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build release NRO
        run: |
          PATH=$PATH:/root/.cargo/bin
          cargo skyline build --release
        env:
          HOME: /root

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: latency-slider-4f-nro
          path: target/aarch64-skyline-switch/release/*.nro
