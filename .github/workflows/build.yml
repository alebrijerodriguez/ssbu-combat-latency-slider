name: Build Skyline Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2023-09-01
          targets: aarch64-nintendo-switch-freestanding
          components: rust-src

      - name: Install cargo-skyline
        run: cargo install cargo-skyline --force

      - name: Build NRO
        run: cargo skyline build --release

      - name: Upload NRO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: latency-slider-4f-nro
          path: target/aarch64-nintendo-switch-freestanding/release/*.nro
